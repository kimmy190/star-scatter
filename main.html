<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>★ star scatter</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Syne:wght@400;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="app">
  <header>
    <h1>★ star scatter</h1>
    <p class="sub">cut stars from your photo · scatter onto a color field</p>
  </header>

  <div class="controls">

    <!-- Upload -->
    <div class="ctrl-group full">
      <div class="ctrl-label">your photo</div>
      <div class="upload-zone" id="uploadZone">
        <input type="file" id="fileIn" accept="image/*">
        <span class="upload-icon">☆</span>
        <strong class="upload-title" id="uploadLabel">click to upload</strong>
        <span class="upload-hint" id="uploadSub">jpg, png, webp — any size · or drag & drop</span>
        <img id="thumbImg" class="preview-thumb" alt="preview">
      </div>
    </div>

    <!-- Color -->
    <div class="ctrl-group">
      <div class="ctrl-label">rectangle color</div>
      <div class="color-row">
        <div class="color-swatch active" style="background:#CCFF00" data-color="#CCFF00"></div>
        <div class="color-swatch" style="background:#F5F0DC" data-color="#F5F0DC"></div>
        <div class="color-swatch" style="background:#1A1A1A" data-color="#1A1A1A"></div>
        <div class="color-swatch" style="background:#E8D5C4" data-color="#E8D5C4"></div>
        <div class="color-swatch" style="background:#A8C5DA" data-color="#A8C5DA"></div>
        <div class="color-swatch" style="background:#F4A0B0" data-color="#F4A0B0"></div>
        <div class="color-custom-wrap">
          <div class="color-custom-preview" id="customSwatch" style="background:#CCFF00"></div>
          <input type="color" id="colorPicker" value="#CCFF00" title="custom color">
        </div>
      </div>
      <p class="hint">last circle = custom color picker</p>
    </div>

    <!-- Placement -->
    <div class="ctrl-group">
      <div class="ctrl-label">rectangle placement</div>
      <div class="pos-grid">
        <div class="pos-btn" data-pos="left">← left</div>
        <div class="pos-btn active" data-pos="right">right →</div>
        <div class="pos-btn" data-pos="top">↑ top</div>
        <div class="pos-btn" data-pos="bottom">↓ bottom</div>
      </div>
    </div>

    <!-- Star size -->
    <div class="ctrl-group full">
      <div class="ctrl-label">star size</div>
      <div class="seg-row">
        <button class="seg-btn active" data-size="xs">
          <svg width="20" height="20" viewBox="0 0 20 20"><polygon points="10,5 11.4,8.5 15,8.5 12.3,10.7 13.5,14.5 10,12.3 6.5,14.5 7.7,10.7 5,8.5 8.6,8.5"/></svg>
          extra small
        </button>
        <button class="seg-btn" data-size="sm">
          <svg width="20" height="20" viewBox="0 0 20 20"><polygon points="10,3.5 12,8 17,8 13,11 14.5,16 10,13 5.5,16 7,11 3,8 8,8"/></svg>
          small
        </button>
        <button class="seg-btn" data-size="md">
          <svg width="20" height="20" viewBox="0 0 20 20"><polygon points="10,1.5 12.5,7.5 19,7.5 13.8,11.5 15.8,18 10,14 4.2,18 6.2,11.5 1,7.5 7.5,7.5"/></svg>
          medium
        </button>
      </div>
    </div>

  </div>

  <button class="gen-btn" id="genBtn" disabled>generate composition ★</button>

  <div class="canvas-wrap" id="canvasWrap">
    <canvas id="c"></canvas>
    <span class="placeholder-text" id="placeholder">upload a photo to begin</span>
  </div>

  <button class="dl-btn" id="dlBtn">↓ download image</button>
</div>

<script src="script.js"></script>

</body>
</html>
